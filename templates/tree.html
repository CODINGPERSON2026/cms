{% extends '/base.html' %}

{% block page_title %}Dashboard{% endblock %}
{% block content %}

<style>
    .tree-container {
        max-width: 900px;
        margin: auto;
        padding: 12px;
    }

    .tree-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
        overflow: hidden;
    }

    .tree-card-header {
        padding: 10px 16px;
        border-bottom: 1px solid #eef0f2;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .tree-card-header h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: #1e293b;
    }

    .tree-card-body {
        padding: 12px 16px;
    }

    .tree ul {
        padding-left: 24px;
        position: relative;
    }

    .tree ul::before {
        content: '';
        position: absolute;
        top: 0;
        left: 8px;
        border-left: 2px solid #e2e8f0;
        height: 100%;
    }

    .tree li {
        list-style: none;
        position: relative;
        margin: 8px 0;
        padding-left: 20px;
    }

    .tree li::before {
        content: '';
        position: absolute;
        top: 15px;
        left: 8px;
        width: 12px;
        border-top: 2px solid #e2e8f0;
    }

    .node {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        background: white;
        min-width: 180px;
        box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
        transition: box-shadow .15s ease, transform .15s ease;
    }

    .node:hover {
        box-shadow: 0 3px 8px rgba(0, 0, 0, .1);
        transform: translateY(-1px);
    }

    .division { border-left: 4px solid #dc3545; }
    .brigade  { border-left: 4px solid #0d6efd; }
    .unit     { border-left: 4px solid #198754; }

    .current-node {
        background: #fff8e1;
        border: 1.5px solid #ffc107;
        font-weight: bold;
    }

    .node-title {
        font-size: 13.5px;
        font-weight: 600;
        color: #1e293b;
        line-height: 1.3;
    }

    .node-type {
        font-size: 10.5px;
        color: #94a3b8;
        letter-spacing: .3px;
    }

    .toggle-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        margin-right: 6px;
        border-radius: 50%;
        background: #eef2ff;
        color: #4f46e5;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        user-select: none;
        vertical-align: middle;
    }

    .toggle-btn:hover {
        background: #e0e7ff;
    }

    .toggle-spacer {
        display: inline-block;
        width: 18px;
        margin-right: 6px;
    }
</style>

<div class="container tree-container">

    <div class="tree-card">
        <div class="tree-card-header">
            <h3>Organisation Hierarchy</h3>
        </div>

        <div class="tree-card-body">
            <div id="treeArea" class="tree">
                <div class="text-center text-muted" style="padding: 20px 0;">
                    Loading hierarchy...
                </div>
            </div>
        </div>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", loadTree);

async function loadTree() {
    const treeArea = document.getElementById("treeArea");

    try {
        const response = await fetch("/mgt/api/tree");
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Failed to load hierarchy");
        }

        treeArea.innerHTML = renderTree(data);
        setupToggleButtons();
    } catch (error) {
        treeArea.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
    }
}

function renderTree(node) {
    const currentClass = node.is_current ? "current-node" : "";
    const hasChildren = node.children && node.children.length > 0;

    let html = `
        <ul>
            <li>
                ${hasChildren
                    ? '<span class="toggle-btn">−</span>'
                    : '<span class="toggle-spacer"></span>'}

                <div class="node ${node.type} ${currentClass}">
                    <div class="node-title">${node.name}${node.is_current ? " ⭐ YOU" : ""}</div>
                    <div class="node-type">${node.type.toUpperCase()}</div>
                </div>
    `;

    if (hasChildren) {
        html += `<div class="children">`;
        node.children.forEach(child => {
            html += renderTree(child);
        });
        html += `</div>`;
    }

    html += `
            </li>
        </ul>
    `;

    return html;
}

function setupToggleButtons() {
    document.querySelectorAll(".toggle-btn").forEach(button => {
        button.addEventListener("click", function () {
            const children = this.parentElement.querySelector(":scope > .children");
            if (!children) return;

            const isHidden = children.style.display === "none";
            children.style.display = isHidden ? "block" : "none";
            this.textContent = isHidden ? "−" : "+";
        });
    });
}
</script>

{% endblock %}
